
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Erreur 403', ~{::section})}">
<head>
    <title>Erreur 403</title>
</head>
<body>
<section>
    <h1>Erreur 403 — Accès refusé</h1>

    <p>
        Vous n'avez pas les autorisations nécessaires
        pour accéder à cette page ou effectuer cette action.
    </p>

    <p><strong>Code HTTP : 403 — Forbidden</strong></p>

    <p>
        <a th:href="@{/}">Retour à l'accueil</a>
    </p>
</section>
</body>
</html>
