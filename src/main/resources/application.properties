spring.application.name=Supervision

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supervision?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:supervision}
spring.datasource.password=${DB_PASSWORD:supervision}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# false dans les tests pour ne pas polluer les autres @SpringBootTest.
app.demo.enabled=${APP_DEMO_ENABLED:true}
# true : vide la base et recharge un jeu daté de l'instant présent (avant une démo).
app.demo.reset=${APP_DEMO_RESET:false}
