# Une base par contexte de test. DB_CLOSE_DELAY garde la base ouverte, donc deux contextes
# (données de démo activées ou non) ne doivent pas partager les mêmes lignes.
spring.datasource.url=jdbc:h2:mem:supervision-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.demo.enabled=false
