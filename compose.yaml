services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: supervision
      MYSQL_USER: supervision
      MYSQL_PASSWORD: supervision
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
